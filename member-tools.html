<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07152d"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="vcaj-theme.css"><link rel="manifest" href="manifest.webmanifest"><title>বকেয়া ও ID Card — VCAJ</title><link rel="stylesheet" href="admin.css">
<style>.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.g label{display:block;font-weight:700;font-size:13px;margin-bottom:4px}.g input,.g select{width:100%}.hide{display:none!important}.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap} .tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1;background:#fff;color:var(--ink);border:2px solid var(--line);padding:11px}.tabs button.on{border-color:var(--orange);background:rgba(255,138,31,.12)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}.idc{width:100%;max-width:340px;aspect-ratio:1.586;border-radius:16px;padding:14px 16px;color:#fff;background:linear-gradient(135deg,#07152d,#1f4a85);position:relative;overflow:hidden;box-shadow:0 10px 26px rgba(0,0,0,.25);margin:auto}.idc:before{content:"🏏";position:absolute;right:-6px;bottom:-18px;font-size:90px;opacity:.12}.idc h4{margin:0;font-size:11px;letter-spacing:.5px;color:#fbbf24}.idc h2{margin:10px 0 2px;font-size:20px;color:#fff}.idc p{margin:2px 0;font-size:12px;color:#dbe6f5}.idc .no{position:absolute;left:16px;bottom:12px;font-weight:900;font-size:15px;color:#fbbf24}.idc .q{position:absolute;right:12px;bottom:10px;background:#fff;padding:4px;border-radius:8px}
.qrbox{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.st{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:800;background:#fee2e2;color:#b91c1c}.st.p{background:#fef3c7;color:#92400e}
@media print{body *{visibility:hidden}.cards,.cards *{visibility:visible}.cards{position:absolute;left:0;top:0;width:100%}.idc{box-shadow:none;-webkit-print-color-adjust:exact;print-color-adjust:exact;break-inside:avoid}}</style></head>

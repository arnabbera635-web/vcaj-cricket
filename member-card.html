<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07152d"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="vcaj-theme.css"><link rel="stylesheet" href="admin.css"><link rel="manifest" href="manifest.webmanifest"><title>Member ID Card — VCAJ</title>
<style>.rc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.rc-grid input,.rc-grid select{width:100%}.hide{display:none!important}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}.tile{padding:14px;border-radius:14px;background:linear-gradient(135deg,#0d2344,#17365f);color:#fff;text-align:center}.tile b{display:block;font-size:22px;color:#fbbf24}.tile span{font-size:12px;color:#cbd5e1}.wa{background:#16a34a!important;color:#fff!important}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;justify-items:center}
.idc{width:324px;height:204px;border-radius:14px;overflow:hidden;color:#fff;background:linear-gradient(135deg,#07152d,#17365f);position:relative;box-shadow:0 10px 26px rgba(0,0,0,.25);font-family:inherit;page-break-inside:avoid}
.idc::before{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,138,31,.35)}
.idc .h{padding:10px 14px;font-size:11px;font-weight:800;letter-spacing:.4px;position:relative}.idc .h b{color:#fbbf24}
.idc .b{padding:2px 14px;position:relative}.idc .n{font-size:20px;font-weight:900;margin-top:8px}.idc .r{color:#fbbf24;font-size:13px;font-weight:700}
.idc .m{font-size:12px;margin-top:8px;color:#dbe7ff;line-height:1.6}.idc .f{position:absolute;left:0;right:0;bottom:0;background:#ff8a1f;color:#07152d;padding:6px 14px;font-weight:900;font-size:12px;display:flex;justify-content:space-between}
@media print{body *{visibility:hidden}.cards,.cards *{visibility:visible}.cards{position:absolute;left:0;top:0;width:100%;grid-template-columns:repeat(2,1fr)}}</style></head>

<main class="container"><section class="hero small"><div><p class="eyebrow">MEMBERS</p><h1>🪪 Member ID Card</h1><p>প্রিন্ট করে ল্যামিনেট করলেই কার্ড তৈরি</p></div></section>
<section class="card" id="loginBox"><h2>🔐 Admin Login</h2><div class="rc-grid"><input id="em" type="email" placeholder="Admin email" autocomplete="username"><input id="pw" type="password" placeholder="Password" autocomplete="current-password"><button id="loginBtn">Login</button></div><p id="loginMsg" class="muted"></p></section>
<div id="app" class="hide"><p><button id="printBtn">🖨️ Print / PDF</button> <a href="member-card.html?all=1"><button type="button">সবার কার্ড</button></a></p><div class="cards" id="cards">লোড হচ্ছে…</div></div></main>

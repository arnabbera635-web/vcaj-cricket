<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07152d"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="vcaj-theme.css"><link rel="stylesheet" href="admin.css"><link rel="manifest" href="manifest.webmanifest"><title>Player Profile — VCAJ</title>
<style>.rc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.rc-grid label{display:block;font-weight:700;font-size:13px;margin-bottom:4px}.rc-grid input,.rc-grid select{width:100%}.hide{display:none!important}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}.tile{padding:14px;border-radius:14px;background:linear-gradient(135deg,#0d2344,#17365f);color:#fff;text-align:center}.tile b{display:block;font-size:24px;color:#fbbf24}.tile span{font-size:12px;color:#cbd5e1}.wa{background:#16a34a!important;color:#fff!important}
.pc{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.av{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:38px;font-weight:900;color:#fff;background:linear-gradient(135deg,var(--orange),#ffb347)}.pc h2{margin:0}.bars .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}</style></head>

<section class="card"><div class="rc-grid"><select id="sel"><option value="">— খেলোয়াড় বাছুন —</option></select><input id="q" placeholder="নাম খুঁজুন"></div></section>
<section class="card hide" id="box"><div class="pc"><div class="av" id="av"></div><div><h2 id="nm"></h2><p class="muted" id="tm"></p></div></div>
<div class="tiles" id="tiles"></div><div class="bars" id="bars"></div>
<p style="margin-top:14px"><button id="shareBtn">📤 শেয়ার</button> <button id="printBtn">🖨️ Print</button></p></section></main>

<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07152d"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="vcaj-theme.css"><link rel="manifest" href="manifest.webmanifest"><title>Wagon Wheel — VCAJ</title>
<style>.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.g select{width:100%}.tabs{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}.tabs button{background:#fff;color:var(--ink);border:2px solid var(--line);padding:9px 16px}.tabs button.on{border-color:var(--orange);background:rgba(255,138,31,.12)}.wrap{max-width:460px;margin:12px auto}.lg{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:13px;margin-top:8px}.lg i{display:inline-block;width:18px;height:4px;border-radius:3px;margin-right:5px;vertical-align:middle}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;margin:12px 0}.tile{padding:12px;border-radius:14px;background:linear-gradient(135deg,#0d2344,#17365f);color:#fff;text-align:center}.tile b{display:block;font-size:22px;color:#fbbf24}.tile span{font-size:12px;color:#cbd5e1}</style></head>
<body><header class="topbar"><a class="brand" href="index.html">VCAJ <span>Cricket</span></a><nav><a href="index.html">Home</a><a href="matches.html">Matches</a><a href="stats.html">Stats</a><a href="analysis.html">Analysis</a><a href="wagon.html">Wagon</a></nav></header>
<main class="container"><section class="hero small"><div><p class="eyebrow">SHOT MAP</p><h1>🎯 Wagon Wheel</h1><p>কোন ব্যাটার কোন দিকে রান করেছে</p></div></section>
<section class="card"><div class="g"><select id="ms"><option value="">— ম্যাচ বাছুন —</option></select><select id="bt"><option value="">সব ব্যাটার</option></select></div><div class="tabs" id="tabs"></div><div id="out" class="muted">একটা ম্যাচ বেছে নিন</div></section></main>
<script type="module">
import {db,collection,getDocs,onSnapshot,query} from "./firebase.js";
import {where} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
import {snapOnce} from "./vcaj-cache.js";
let EV=[],un2=null,mode="G",ori="C";
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let M=[],S=[],inn=1,un=null,cur="";
const col=r=>r>=6?"#a855f7":r===4?"#ff8a1f":r===1?"#38bdf8":r>=2?"#22c55e":"#94a3b8";const pt=s=>{let a=s.angle*Math.PI/180;const R=Math.max(.15,s.dist)*100,h=s.hand==="L"?"L":"R",m=ori==="B"?mode:"G";if(ori==="B"&&s.bowlerEnd==="S")a+=Math.PI;let x=Math.sin(a)*R;if((m==="R"&&h==="L")||(m==="L"&&h==="R"))x=-x;return[x,-Math.cos(a)*R]};
function draw(){const b=$("bt").value,base=S.filter(s=>!s.superOver&&s.inningsNo===inn&&(!b||s.batter===b)),L=base.filter(s=>(s.kind||"run")!=="wicket"),W=base.filter(s=>s.kind==="wicket");
 $("tabs").innerHTML=[1,2].map(i=>`<button data-i="${i}" class="${i===inn?"on":""}">${i}st Innings</button>`).join("");$("tabs").querySelectorAll("button").forEach(x=>x.onclick=()=>{inn=+x.dataset.i;draw()});
 const names=[...new Set(S.filter(s=>!s.superOver&&s.inningsNo===inn).map(s=>s.batter))].sort();const keep=$("bt").value;$("bt").innerHTML='<option value="">সব ব্যাটার</option>'+names.map(n=>`<option>${esc(n)}</option>`).join("");$("bt").value=names.includes(keep)?keep:"";
 if(!cur){$("out").textContent="একটা ম্যাচ বেছে নিন";return}
 if(!S.length&&!EV.some(e=>e.type==="wicket")){$("out").innerHTML="<p>এই ম্যাচের কোনো শটের দিক রেকর্ড করা হয়নি। স্কোরার রান দেওয়ার পর শটের দিক বেছে নিলে এখানে আসবে।</p>";return}
 const sv=L.reduce((a,s)=>a+s.runs,0),f=L.filter(s=>s.runs===4).length,x=L.filter(s=>s.runs>=6).length;
 const wk=W.map(s=>{const[px,py]=pt(s);return `<g><text x="${px.toFixed(1)}" y="${(py+4).toFixed(1)}" font-size="13" text-anchor="middle" fill="#ef4444" font-weight="900">✕</text>${s.fielder&&s.fielder.indexOf("নির্বাচন")<0?`<text x="${px.toFixed(1)}" y="${(py+15).toFixed(1)}" font-size="7" text-anchor="middle" fill="#fff">${esc(s.fielder.split(" ")[0])}</text>`:""}</g>`}).join("");
 const lines=L.map(s=>{const[px,py]=pt(s);return `<line x1="0" y1="0" x2="${px.toFixed(1)}" y2="${py.toFixed(1)}" stroke="${col(s.runs)}" stroke-width="${s.runs>=4?3:s.runs===0?1:2}" stroke-linecap="round" opacity="${s.runs===0?.55:.9}"/>`}).join("");
 $("out").innerHTML=`<div class="tiles"><div class="tile"><b>${L.length}</b><span>শট</span></div><div class="tile"><b>${sv}</b><span>রান (দিক-সহ)</span></div><div class="tile"><b>${f}/${x}</b><span>চার / ছক্কা</span></div><div class="tile"><b>${W.length}</b><span>আউটের জায়গা</span></div></div>
 <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:center;justify-content:center"><div class="wrap" style="flex:1 1 280px;margin:0"><svg viewBox="-110 -124 220 248" style="width:100%"><circle r="104" fill="#1f7a3a" stroke="#fff" stroke-width="3"/><circle r="62" fill="none" stroke="#ffffff55" stroke-dasharray="4 4"/><rect x="-6" y="-26" width="12" height="52" rx="3" fill="#d9b779"/>${lines}${wk}${ori==="C"?`<text y="-112" font-size="9" fill="currentColor" text-anchor="middle">উত্তর ↑</text><text y="118" font-size="9" fill="currentColor" text-anchor="middle">দক্ষিণ ↓</text>`:`<text y="-112" font-size="9" fill="currentColor" text-anchor="middle">▲ বোলারের দিক</text>`}</svg></div><div id="opt" style="flex:0 1 190px;display:flex;flex-direction:column;gap:8px"><b style="font-size:13px">🧭 দিক</b>${[["C","🧭 মাঠের আসল দিক (উত্তর ↑)"],["B","🏏 ব্যাটারের মুখোমুখি (সব ওভার বোলার ↑)"]].map(([k,t])=>`<button data-o="${k}" style="text-align:left;padding:10px 12px;border-radius:12px;border:2px solid ${ori===k?"var(--orange)":"var(--line)"};background:${ori===k?"rgba(255,138,31,.15)":"transparent"};color:inherit">${t}</button>`).join("")}<b style="font-size:13px;margin-top:6px">👁️ ব্যাটারের হাত</b>${[["G","🙌 উল্টানো নেই"],["R","🤚 সবাইকে ডানহাতি ধরে"],["L","✋ সবাইকে বাঁহাতি ধরে"]].map(([k,t])=>`<button ${ori!=="B"?"disabled":""} data-m="${k}" style="text-align:left;padding:10px 12px;border-radius:12px;border:2px solid ${mode===k?"var(--orange)":"var(--line)"};background:${mode===k?"rgba(255,138,31,.15)":"transparent"};color:inherit">${t}</button>`).join("")}<small class="muted">${ori==="C"?"মাঠের আসল দিক: উত্তর-দক্ষিণ রেখায় যেদিকে বল গেছে ঠিক সেদিকেই আঁকা। (হাত অনুযায়ী উল্টানোর অপশন এই দৃষ্টিতে বন্ধ।)":mode==="G"?"যে ওভারে বোলার দক্ষিণ প্রান্তে ছিল সেগুলো ঘুরিয়ে দেওয়া হয়েছে, সব শট বোলার ওপরে ধরে আঁকা।":mode==="R"?"বাঁহাতি ব্যাটারের শট উল্টে দেওয়া হয়েছে, যাতে সবাইকে ডানহাতি ধরে তুলনা করা যায়।":"ডানহাতি ব্যাটারের শট উল্টে দেওয়া হয়েছে, যাতে সবাইকে বাঁহাতি ধরে তুলনা করা যায়।"}</small><small class="muted">বাঁহাতি ব্যাটারের শট: ${base.filter(s=>s.hand==="L").length} / ${base.length}</small></div></div>
 <div class="lg"><span><i style="background:#38bdf8"></i>১</span><span><i style="background:#22c55e"></i>২-৩</span><span><i style="background:#ff8a1f"></i>চার</span><span><i style="background:#a855f7"></i>ছক্কা</span><span><i style="background:#94a3b8"></i>ডট</span><span style="color:#ef4444;font-weight:900">✕ ক্যাচ/রান-আউট</span></div>${fieldingHtml()}<p class="muted" style="text-align:center;font-size:12px">শুধু যে বলগুলোর দিক রেকর্ড হয়েছে সেগুলোই দেখানো হচ্ছে। ব্যাটারের হাত স্কোরারে ঠিক করা না থাকলে ডানহাতি ধরা হয়।</p>`;
 $("out").querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{mode=b.dataset.m;draw()});$("out").querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{ori=b.dataset.o;draw()})}
function fieldingHtml(){const w=EV.filter(e=>e.type==="wicket"&&!e.superOver&&e.inningsNo===inn&&["caught","runOut","stumped"].includes(e.dismissalType)&&e.fielderName);
 if(!w.length)return"";const by={};w.forEach(e=>{by[e.fielderName]=(by[e.fielderName]||0)+1});
 return `<h3 style="margin-top:18px">🧤 ফিল্ডিং — কে ধরেছে / আউট করেছে</h3>${Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([n,c])=>`<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)"><span>${esc(n)}</span><b>${c}</b></div>`).join("")}<div style="margin-top:8px;font-size:13px">${w.map(e=>`<div>• ${esc(e.text||(e.dismissedBatter+" — "+e.dismissalType+" ("+e.fielderName+")"))}</div>`).join("")}</div>`}
function pick(id){cur=id;S=[];EV=[];inn=1;if(un){un();un=null}if(un2){un2();un2=null}if(!id){draw();return}
 un2=onSnapshot(query(collection(db,"matches",id,"events"),where("type","==","wicket")),s=>{EV=s.docs.map(d=>d.data());draw()},()=>{});un=onSnapshot(query(collection(db,"wagonShots"),where("matchId","==",id)),s=>{S=s.docs.map(d=>d.data());draw()},()=>{$("out").textContent="লোড হয়নি"})}
$("ms").onchange=()=>pick($("ms").value);$("bt").onchange=draw;
snapOnce(db,getDocs,collection,"matches",s=>{M=s.docs.map(d=>({id:d.id,...d.data()}));const v=$("ms").value;$("ms").innerHTML='<option value="">— ম্যাচ বাছুন —</option>'+M.map(m=>`<option value="${esc(m.id)}">${esc((m.stageName||"Match")+": "+(m.team1Name||"")+" vs "+(m.team2Name||""))}</option>`).join("");$("ms").value=v;const q=new URLSearchParams(location.search).get("match");if(q&&!cur&&M.find(m=>m.id===q)){$("ms").value=q;pick(q)}});
</script><script src="vcaj-enhance.js" defer></script></body></html>

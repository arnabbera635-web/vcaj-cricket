<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VCAJ Awards Admin</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="admin.css"><style>
.grid.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid label{display:grid;gap:6px}.record-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:12px}.record{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:9px}.record b{display:block;font-size:18px}.record small,.muted,.team{color:#64748b}.calc-head,.player-top{display:flex;justify-content:space-between;gap:10px;align-items:center}.player-cards{display:grid;gap:10px;margin-top:12px}.player-card{background:#fff;border:1px solid #dbe3ee;border-radius:14px;padding:12px}.player-card.recommended{border:2px solid #2563eb;background:#f8fbff}.rank{font-size:12px;font-weight:800;color:#2563eb}.player-top h3{margin:3px 0}.player-top button{width:auto}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:700px}td,th{padding:9px;border-bottom:1px solid #e5e7eb;text-align:left}th{background:#f8fafc}.notice{padding:12px;background:#fff7ed;border:1px solid #fed7aa;border-radius:10px}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}.muted{font-size:13px}@media(max-width:650px){.grid.two{grid-template-columns:1fr}.record-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:450px){.record-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body class="auth-pending"><header class="topbar"><a class="brand" href="admin.html">← ADMIN PANEL</a></header><main class="wrap">
<section class="card"><div class="actions" style="justify-content:space-between"><div><h1>🏆 AWARDS</h1><p class="muted">Match Awards ও Tournament Awards আলাদা হিসাব</p></div><button id="logout">Logout</button></div></section>
<section class="card"><h2>Player Database</h2><div id="playerCount">Loading...</div></section>
<section class="card"><h2>Calculate Award</h2><div class="grid two">
<label>Season<input id="season" type="number" value="2026"></label>
<label>Award Type<select id="awardScope"><option value="TOURNAMENT">🏆 Tournament Award</option><option value="MATCH">🏏 Match Award</option></select></label>
<div id="matchWrap" class="hidden"><label>Match<select id="matchPicker"><option value="">ম্যাচ নির্বাচন করুন</option></select></label></div>
<label>Award<select id="awardType"></select></label></div><p id="modeNote" class="muted"></p>
<div class="actions"><button id="calculate">Calculate Award</button><span id="calcMsg" class="muted"></span></div><div id="results"></div></section>
<section class="card"><h2>Save Award</h2><div class="grid two">
<label>Winner Player<select id="winnerPlayer"><option value="">আগে Calculate করুন</option></select></label>
<label>Custom Award Name<input id="customName" placeholder="Custom Award হলে লিখুন"></label>
<label>Prize / Title<input id="prize" placeholder="Trophy + Prize Money"></label>
<label>Note<textarea id="note" placeholder="প্রয়োজনে মন্তব্য লিখুন"></textarea></label></div>
<div class="actions"><button id="save">💾 Save Award</button><span id="saveMsg" class="muted"></span></div></section>
<section class="card"><h2>Saved Awards</h2><div id="saved">Loading...</div></section></main><script type="module" src="awards.js?v=8"></script></body></html>

<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VCAJ — Awards</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="admin.css"></head>
<body class="auth-pending"><header class="topbar"><a class="brand" href="admin.html">← ADMIN PANEL</a></header>
<main class="wrap">
<section class="card"><div class="admin-toolbar"><div><h1>🏆 AWARDS</h1><p class="muted">Player statistics ও tournament awards</p></div><button data-logout>Logout</button></div></section>
<section class="card"><h2>Player Statistics</h2><div id="statsTable">Loading...</div></section>
<section class="card"><h2>Award Entry</h2><div class="grid two">
<label>Season<input id="awardSeason" type="number" value="2026"></label>
<label>Award<select id="awardType"><option>Player of the Tournament</option><option>Best Batter</option><option>Best Bowler</option><option>Best Fielder</option><option>Best Wicketkeeper</option><option>Best Emerging Player</option><option>Man of the Match</option><option>Custom Award</option></select></label>
<label>Player<select id="awardPlayer"></select></label><label>Custom Award Name<input id="awardCustomName"></label>
<label>Prize / Title<input id="awardPrize"></label><label>Note<textarea id="awardNote"></textarea></label>
</div><button id="saveAward">Award Save করুন</button><p id="awardMsg" class="muted"></p></section>
<section class="card"><h2>Saved Awards</h2><div id="awardTable"></div></section>
</main>
<script type="module">
import {guardAdmin,bindLogout} from "./admin.js";
await guardAdmin();
bindLogout();
await import("./awards.js?v=4");
</script>
</body></html>

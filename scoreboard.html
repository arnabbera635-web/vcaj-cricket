<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071a35"><title>VCAJ Stadium Scoreboard</title><link rel="stylesheet" href="style.css">
<style>
html,body{margin:0;min-height:100%;background:#06152b;color:#fff}body{padding:clamp(8px,2vw,24px)}#stadiumBoard{max-width:1600px;margin:auto;min-height:95vh;padding:clamp(18px,3vw,42px);border-radius:24px;background:linear-gradient(135deg,#071a35,#123763 60%,#071a35);box-shadow:0 20px 70px #0008}.head{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.head h1{font-size:clamp(24px,4vw,52px);margin:0}.live{color:#fca5a5;font-weight:900;letter-spacing:.12em}.controls button{border:0;border-radius:10px;padding:12px 18px;background:#f59e0b;color:#111827;font-weight:900;font-size:16px}.score-match-title{text-align:center;color:#cbd5e1;margin:24px 0 10px;font-size:clamp(16px,2vw,28px)}.score-main{text-align:center;padding:clamp(20px,4vw,55px) 10px;background:#ffffff0d;border:1px solid #ffffff22;border-radius:20px}.score-team{font-size:clamp(28px,4vw,60px);font-weight:900}.score-big{font-size:clamp(90px,18vw,220px);font-weight:1000;line-height:1.02;color:#fbbf24;font-variant-numeric:tabular-nums}.score-overs{font-size:clamp(22px,3vw,42px);font-weight:800}.score-meta{color:#cbd5e1;font-size:clamp(15px,2vw,25px);margin-top:10px}.score-columns{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.score-panel{background:#fff;color:#0f172a;border-radius:18px;padding:clamp(15px,2vw,28px)}.score-panel h3{font-size:clamp(20px,2vw,30px);margin:0 0 12px}.score-row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #e5e7eb;font-size:clamp(16px,2vw,26px)}.score-result{text-align:center;color:#fde68a;font-size:clamp(23px,3vw,42px);font-weight:900;margin:24px 0}.score-wait{text-align:center;padding:15vh 10px;font-size:clamp(22px,3vw,40px)}@media(max-width:650px){.score-columns{grid-template-columns:1fr}}
</style></head><body><main id="stadiumBoard"><div class="head"><div><div class="live">● VCAJ LIVE</div><h1>জেলিয়াখালী মন্ডল এন্ড মন্ডল ক্রিকেট টুর্নামেন্ট</h1></div><div class="controls"><button id="stadiumFullscreen">⛶ Full Screen</button></div></div><div id="scoreboardContent" class="score-wait">লাইভ স্কোরের অপেক্ষায়…</div></main><script type="module" src="scoreboard.js?v=1"></script><script>document.getElementById('stadiumFullscreen').addEventListener('click',()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()})</script></body></html>

<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VCAJ — Live Scoring</title>
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="admin.css">
</head>
<body class="auth-pending">
<header class="topbar">
 <a class="brand" href="admin.html">← ADMIN PANEL</a>
</header>
<main class="wrap">
<section class="card">
 <div class="admin-toolbar"><div><h1>🏏 LIVE SCORING</h1><p class="muted">Match setup & live scoring</p></div><button data-logout>Logout</button></div>
</section>

<section class="card" id="setupCard">
 <h2>16 TEAM KNOCKOUT — MATCH SETUP</h2>
 <div class="grid two">
  <label>Season<input id="season" type="number" value="2026"></label>
  <label>Stage<select id="stage"><option value="R16">Round of 16</option><option value="QF">Quarter Final</option><option value="SF">Semi Final</option><option value="FINAL">Final</option><option value="CUSTOM">Custom</option></select></label>
  <label>Bracket Key<input id="bracketKey" placeholder="যেমন R16-1"></label>
  <label>Overs<select id="overs"><option value="5">5</option><option value="10">10</option><option value="15" selected>15</option><option value="20">20</option><option value="custom">Custom</option></select><input id="customOvers" class="hidden" type="number" min="1" max="50" value="15"></label>
  <label>প্রথম দল<select id="team1"><option value="">প্রথম দল</option></select></label>
  <label>দ্বিতীয় দল<select id="team2"><option value="">দ্বিতীয় দল</option></select></label>
  <label>Match ID<input id="matchId" placeholder="Auto generated"></label>
 </div>
 <div class="admin-actions">
  <button id="refreshSetup">দল/খেলোয়াড় Refresh</button>
  <button id="createMatch">Match তৈরি করে Scoring শুরু করুন</button>
 </div>
 <p id="setupMsg" class="muted"></p>
</section>

<section class="card">
 <div class="admin-toolbar">
  <div><h2 id="matchTitle">No match loaded</h2><p id="matchMeta" class="muted">—</p></div>
  <div><span id="syncStatus" class="pill">—</span></div>
 </div>
 <div class="grid two">
  <label>Active Match ID<input id="activeMatchId" placeholder="Match ID"><button id="loadMatch">Load Match</button></label>
  <label>Commentary<select id="commentaryLang"><option value="bn">বাংলা</option><option value="en">English</option></select></label>
  <label>Target<input id="target" type="number" min="0" value="0"></label>
 </div>
</section>

<section class="card" id="scorerApp">
 <div class="stat-grid">
  <div class="stat-box"><span>Batting</span><strong id="battingTeam">—</strong></div>
  <div class="stat-box"><span>Score</span><strong id="score">0/0</strong></div>
  <div class="stat-box"><span>Overs</span><strong id="oversText">0.0 / 15</strong></div>
  <div class="stat-box"><span>Run Rate</span><strong id="crr">CRR 0.00</strong></div>
  <div class="stat-box"><span>Target</span><strong id="rrr">Target —</strong></div>
  <div class="stat-box"><span>Innings</span><strong id="inningsNo">Innings 1 of 2</strong></div>
 </div>
 <div class="admin-actions" style="margin-top:12px">
  <span id="freeHitBadge" class="pill hidden">FREE HIT</span>
  <span id="bowlerChangeMsg" class="muted"></span>
 </div>

 <div class="grid three" style="margin-top:16px">
  <label>Striker<select id="striker"></select><small id="batInfo"></small></label>
  <label>Non-striker<select id="nonStriker"></select></label>
  <label>Bowler<select id="bowler"></select><small id="bowlInfo"></small></label>
 </div>

 <div class="card">
  <h3>RUNS</h3>
  <div class="admin-actions" id="runButtons">
   <button data-run="0">0</button><button data-run="1">1</button><button data-run="2">2</button>
   <button data-run="3">3</button><button data-run="4">4</button><button data-run="5">5</button><button data-run="6">6</button>
  </div>
  <h3>EXTRAS / WICKET</h3>
  <div class="admin-actions">
   <button data-extra="wide">Wide</button><button data-extra="noBall">No Ball</button>
   <button data-extra="bye" data-value="1">Bye 1</button><button data-extra="bye" data-value="2">Bye 2</button>
   <button data-extra="legBye" data-value="1">Leg Bye 1</button><button data-extra="legBye" data-value="2">Leg Bye 2</button>
   <button id="wicketBtn">Wicket</button>
  </div>
  <div class="admin-actions" style="margin-top:12px">
   <button id="undoBtn">Undo</button><button id="endInnings">Innings End</button>
   <button id="startSecond" class="hidden">Start 2nd Innings</button>
   <button id="startSuper" class="hidden">Start Super Over</button>
   <button id="finishSuper" class="hidden">Finish Super Over</button>
   <button id="backupBtn">Backup JSON</button>
  </div>
 </div>

 <div id="resultBox" class="card hidden"><h3>Result</h3><p id="resultText"></p></div>

 <div class="grid two">
  <div class="card"><h3>Batting</h3><div id="battingCard"></div></div>
  <div class="card"><h3>Bowling</h3><div id="bowlingCard"></div></div>
 </div>
 <div class="card"><h3>Commentary</h3><div id="commentary"></div></div>
</section>
</main>

<div id="wicketModal" class="modal hidden">
 <div class="modal-content card">
  <h2>Wicket</h2>
  <label>Dismissed batter<select id="dismissedBatter"></select></label>
  <label>Dismissal<select id="dismissalType">
   <option value="bowled">Bowled</option><option value="caught">Caught</option><option value="lbw">LBW</option>
   <option value="runOut">Run Out</option><option value="stumped">Stumped</option><option value="hitWicket">Hit Wicket</option>
   <option value="obstructing">Obstructing the Field</option><option value="hitTwice">Hit the Ball Twice</option>
   <option value="timedOut">Timed Out</option><option value="retiredOut">Retired Out</option>
  </select></label>
  <div id="fielderBox" class="hidden"><label id="fielderLabel">Fielder<select id="fielder"></select></label></div>
  <div class="admin-actions"><button id="confirmWicket">Confirm Wicket</button><button id="cancelWicket">Cancel</button></div>
 </div>
</div>

<script type="module">
import {guardAdmin,bindLogout} from "./admin.js";
await guardAdmin();
bindLogout();
await import("./scorer.js?v=11");
</script>
</body>
</html>

<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07152d"><meta name="robots" content="noindex"><title>চাঁদা পরিশোধ — VCAJ</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#0d2344;--muted:#5b6b84;--line:#dbe4f0;--orange:#ff8a1f;--green:#16a34a}
@media(prefers-color-scheme:dark){:root{--bg:#0a1220;--card:#111d33;--ink:#e8eef9;--muted:#94a3bd;--line:#223352}}
*{box-sizing:border-box}body{margin:0;font-family:Inter,"Noto Sans Bengali",system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:16px;line-height:1.55}
.w{max-width:460px;margin:0 auto}.top{text-align:center;margin:8px 0 14px}.top b{font-size:13px;letter-spacing:1px;color:var(--orange)}.top h1{margin:4px 0 0;font-size:19px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 14px 34px rgba(7,21,45,.12)}
.amt{text-align:center;font-size:44px;font-weight:900;color:var(--green);margin:6px 0 2px}.sub{text-align:center;color:var(--muted);font-size:14px}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}.row span:first-child{color:var(--muted)}.row b{text-align:right;word-break:break-all}
.pay{display:block;margin:16px 0 8px;padding:15px;border-radius:14px;background:linear-gradient(135deg,var(--green),#22c55e);color:#fff;text-align:center;font-weight:800;font-size:17px;text-decoration:none;box-shadow:0 10px 22px rgba(22,163,74,.3)}
.b2{display:block;width:100%;margin-top:8px;padding:12px;border-radius:12px;border:2px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-weight:700;cursor:pointer;text-align:center;text-decoration:none}
#qr{display:flex;justify-content:center;margin:12px 0}#qr img,#qr canvas{border-radius:10px;background:#fff;padding:8px}
.note{margin-top:14px;padding:10px 12px;border-radius:12px;background:rgba(255,138,31,.12);font-size:13px}.err{color:#d64545;font-weight:800;text-align:center}
.hide{display:none}
</style></head>
<body><div class="w"><div class="top"><b>VCAJ</b><h1>Vivekananda Cricket Association of Jeliakhali</h1></div>
<div class="card" id="c"><p class="sub">লোড হচ্ছে…</p></div>
<p class="sub" style="margin-top:14px;font-size:12px">এটি VCAJ-এর সদস্য চাঁদার পেমেন্ট রিকোয়েস্ট। টাকা পাঠানোর আগে প্রাপকের নাম ও UPI ID মিলিয়ে নিন।</p></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module">
import {parsePay,upiUri} from "./pay-core.js";
const c=document.getElementById("c"),p=parsePay(location.search);
const el=(t,a={},x="")=>{const e=document.createElement(t);for(const k in a)e.setAttribute(k,a[k]);if(x)e.textContent=x;return e};
if(!p.ok){c.replaceChildren(el("p",{class:"err"},"এই পেমেন্ট লিংকটা ঠিক নেই ("+p.errs.join(", ")+")। ক্লাবের কাছ থেকে নতুন লিংক চেয়ে নিন।"))}
else{
 const uri=upiUri(p),f=document.createDocumentFragment();
 f.append(el("div",{class:"sub"},"সদস্য চাঁদা"+(p.s?" — "+p.s:"")),el("div",{class:"amt"},"₹"+p.am.toLocaleString("en-IN")));
 const row=(a,b)=>{const r=el("div",{class:"row"});r.append(el("span",{},a),el("b",{},b));return r};
 if(p.n)f.append(row("সদস্য",p.n));f.append(row("প্রাপক",p.pn),row("UPI ID",p.pa));
 const a=el("a",{class:"pay",href:uri},"💳 UPI অ্যাপ দিয়ে ₹"+p.am.toLocaleString("en-IN")+" পরিশোধ করুন");f.append(a);
 const cp=el("button",{class:"b2",type:"button"},"📋 UPI ID কপি করুন");cp.onclick=()=>{(navigator.clipboard?navigator.clipboard.writeText(p.pa):Promise.reject()).then(()=>cp.textContent="✅ কপি হয়েছে").catch(()=>prompt("UPI ID:",p.pa))};f.append(cp);
 const q=el("div",{id:"qr"});f.append(el("div",{class:"sub"},"অন্য ফোন থেকে পাঠাতে এই QR স্ক্যান করুন"),q);
 if(p.wa){const t="আমি "+(p.n||"")+" ₹"+p.am+" সদস্য চাঁদা পরিশোধ করেছি। Transaction ID: ";const d=el("a",{class:"b2",href:"https://wa.me/"+p.wa+"?text="+encodeURIComponent(t),target:"_blank",rel:"noopener"},"✅ পরিশোধ করেছি — ক্লাবকে জানান (WhatsApp)");f.append(d)}
 f.append(el("div",{class:"note"},"পরিশোধের পর Admin যাচাই করে আপনাকে Receipt দেবেন। পেমেন্ট নিজে থেকে নিশ্চিত হয় না, তাই Transaction ID বা স্ক্রিনশট সংরক্ষণ করে রাখুন।"));
 c.replaceChildren(f);
 try{new QRCode(q,{text:uri,width:180,height:180,correctLevel:QRCode.CorrectLevel.M})}catch(e){q.style.display="none"}}
</script></body></html>

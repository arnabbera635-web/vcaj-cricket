<style>.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.hide{display:none!important}.lg{padding:10px 0;border-bottom:1px solid var(--line)}.lg small{color:var(--muted)}.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:800;background:#e8eef9;color:#0d2344;margin-right:6px}.tag.c{background:#dcfce7;color:#166534}.tag.e{background:#fef3c7;color:#92400e}.tag.r{background:#fee2e2;color:#b91c1c}pre{white-space:pre-wrap;word-break:break-word;font-size:11px;color:var(--muted);margin:4px 0 0}</style></head>
<body><header class="topbar"><a class="brand" href="index.html">VCAJ <span>Cricket</span></a><nav><a href="admin.html">Admin</a><a href="accounts.html">Accounts</a><a href="office-bearers.html">পদাধিকারী</a><a href="activity-log.html">Activity Log</a></nav></header>
<main class="container"><section class="hero small"><div><p class="eyebrow">ADMIN</p><h1>🕵️ Activity Log</h1><p>কে, কখন, কী করেছে — রসিদ, ভাউচার ও পদ বদলের হিসাব (কেউ বদলাতে বা মুছতে পারে না)</p></div></section>
<section class="card" id="lg"><h2>🔐 Admin Login</h2><div class="g"><input id="em" type="email" placeholder="Admin email" autocomplete="username"><input id="pw" type="password" placeholder="Password" autocomplete="current-password"><button id="lb">Login</button></div><p id="lm" class="muted"></p></section>
<div id="app" class="hide"><section class="card"><div class="g"><select id="fp"><option value="">সব ব্যক্তি</option></select><select id="fa"><option value="">সব কাজ</option><option value="receipt">রসিদ</option><option value="voucher">ভাউচার</option><option value="office">পদ</option></select><input id="fs" placeholder="খুঁজুন…"><button id="rf">🔄 আবার লোড</button><button id="csv">⬇️ CSV</button></div><p class="muted" id="cnt" style="font-size:13px"></p><div id="list">লোড হচ্ছে…</div></section></div></main>

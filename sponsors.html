<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07152d"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="vcaj-theme.css"><link rel="manifest" href="manifest.webmanifest"><title>Sponsors — VCAJ</title>
<style>
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.g label{display:block;font-weight:700;font-size:13px;margin-bottom:4px}.g input,.g select,.g textarea{width:100%}.hide{display:none!important}
.sh{position:relative;overflow:hidden;border-radius:22px;padding:26px 22px;color:#fff;background:radial-gradient(circle at 90% 0,#ff8a1f55,transparent 55%),linear-gradient(135deg,#07152d,#1f4a85);margin-bottom:16px}
.sh h1{margin:0 0 6px;font-size:clamp(24px,5vw,38px)}.sh p{margin:0;color:#dbe6f5}.sh:after{content:"🤝";position:absolute;right:14px;bottom:-18px;font-size:110px;opacity:.1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:16px}.stat{background:#ffffff1a;border:1px solid #ffffff33;border-radius:14px;padding:12px;text-align:center}.stat b{display:block;font-size:28px;color:#fbbf24}.stat span{font-size:12px;color:#dbe6f5}
.tick{display:flex;align-items:center;gap:10px;overflow:hidden;background:#0d2344;color:#fff;border-radius:14px;padding:8px 12px;margin-bottom:16px;font-size:14px}.tick .l{background:var(--orange);color:#07152d;font-weight:800;padding:2px 10px;border-radius:99px;white-space:nowrap}.tick .w{overflow:hidden;flex:1}.tick .t{display:inline-block;white-space:nowrap;animation:tk 60s linear infinite}@keyframes tk{to{transform:translateX(-50%)}}
.spot{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;padding:18px;border-radius:20px;border:2px solid #fbbf24;background:linear-gradient(135deg,rgba(251,191,36,.14),transparent);margin-bottom:16px;position:relative}.spot .ic{width:84px;height:84px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:42px;color:#fff}.spot h2{margin:0}.spot .lb{position:absolute;top:-12px;left:18px;background:#fbbf24;color:#07152d;font-weight:800;font-size:12px;padding:3px 12px;border-radius:99px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.bar input{flex:1;min-width:200px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.chip{background:var(--card,#fff);color:var(--ink);border:2px solid var(--line);border-radius:99px;padding:6px 13px;font-size:13px}.chip.on{border-color:var(--orange);background:rgba(255,138,31,.15);font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:16px}
.sc{border-radius:20px;overflow:hidden;background:var(--card,#fff);border:1px solid var(--line);display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s;animation:up .5s both}.sc:hover{transform:translateY(-4px);box-shadow:0 20px 40px rgba(7,21,45,.18)}@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.sc .hd{position:relative;padding:18px 16px 30px;color:#fff;min-height:104px}.sc .hd .em{font-size:36px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.25))}.sc .hd .cn{position:absolute;right:12px;top:12px;font-size:11px;background:#00000040;padding:3px 10px;border-radius:99px}.sc .hd img{position:absolute;right:12px;bottom:-22px;width:58px;height:58px;object-fit:contain;background:#fff;border-radius:14px;padding:4px;box-shadow:0 6px 16px rgba(0,0,0,.2)}
.sc .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:7px;flex:1}.sc h3{margin:0;font-size:18px;line-height:1.25}.own{color:var(--muted);font-size:14px}.ds{font-size:14px}.pl{font-size:13px;color:var(--muted)}.tg{display:inline-block;background:#dbeafe;color:#1d4ed8;font-weight:800;font-size:11px;padding:2px 9px;border-radius:99px;align-self:flex-start}.ti{display:inline-block;background:#fef3c7;color:#92400e;font-weight:800;font-size:11px;padding:2px 9px;border-radius:99px;align-self:flex-start}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:8px}.b{display:inline-flex;align-items:center;gap:5px;padding:8px 12px;border-radius:12px;border:0;font-size:13px;font-weight:700;text-decoration:none;cursor:pointer;background:#e8eef9;color:#0d2344}.b.call{background:#16a34a;color:#fff}.b.wa{background:#25d366;color:#07152d}.b.fav.on{background:#fee2e2;color:#dc2626}
.adm{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.aw{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}.pz{position:relative;padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--card,#fff);overflow:hidden}.pz:before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:linear-gradient(90deg,#fbbf24,#ff8a1f)}.pz .no{position:absolute;right:12px;top:14px;font-size:12px;color:var(--muted);font-weight:800}.pz .ic{font-size:30px}.pz h4{margin:6px 0;font-size:15px;line-height:1.35}.pz .mm{color:#b45309;font-weight:800;font-size:13px}.pz .by{margin-top:8px;font-size:13px;background:rgba(255,138,31,.1);padding:6px 10px;border-radius:10px}.pz .by a{color:var(--orange);font-weight:800;text-decoration:underline;cursor:pointer}
h2.sec{margin:26px 0 10px;font-size:22px}.empty{padding:26px;text-align:center;color:var(--muted)}
@media(max-width:560px){.spot{grid-template-columns:1fr}}
@media print{.topbar,.tick,.bar,.chips,#adm,#lg,.acts,.adm,.vc-footer,#vc-top,#vc-theme,.sh:after,#hidBox{display:none!important}.sc,.pz{break-inside:avoid;box-shadow:none!important}.sc .hd{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head>
<body><header class="topbar"><a class="brand" href="index.html">VCAJ <span>Cricket</span></a><nav><a href="index.html">Home</a><a href="live.html">Live Score</a><a href="matches.html">Matches</a><a href="sponsors.html">Sponsors</a></nav></header>
<main class="container">
<section class="sh"><p class="eyebrow" style="color:#fbbf24;font-weight:800;letter-spacing:1px">OUR PARTNERS</p><h1>🤝 আমাদের Sponsors</h1><p>যাঁদের সহযোগিতায় এই টুর্নামেন্ট সম্ভব হয়েছে — আমরা কৃতজ্ঞ 🙏</p><div class="stats" id="stats"></div></section>
<div class="tick" id="tick"><span class="l">🤝 সহযোগী</span><span class="w"><span class="t" id="tickT"></span></span></div>
<div id="spot"></div>
<div class="bar"><input id="q" type="search" placeholder="🔍 নাম, মালিক, জায়গা বা নম্বর খুঁজুন…"><button class="b" id="favF">🤍 পছন্দের</button><button class="b" id="vcf">📇 সব নম্বর ফোনে সেভ</button><button class="b" id="prt">🖨️ Print / PDF</button></div>
<div class="chips" id="chips"></div>
<div class="grid" id="grid"></div>
<h2 class="sec">🏆 পুরস্কারের পৃষ্ঠপোষক <small class="muted" style="font-size:13px">(বিশেষ পুরস্কার — সৌজন্যে)</small></h2>
<div class="aw" id="aw"></div>
<section class="card hide" id="adm" style="margin-top:22px"><h2 id="admT">⚙️ Sponsor যোগ করুন (Admin)</h2>
<div class="g"><div><label>নাম *</label><input id="n"></div><div><label>ধরন</label><select id="cat"></select></div><div><label>মালিক / প্রোঃ</label><input id="own"></div><div><label>মোবাইল ১</label><input id="p1" inputmode="numeric"></div><div><label>মোবাইল ২</label><input id="p2" inputmode="numeric"></div><div><label>জায়গা / ঠিকানা</label><input id="pl"></div><div style="grid-column:1/-1"><label>বিবরণ</label><textarea id="ds" rows="2"></textarea></div><div><label>Tier (ঐচ্ছিক)</label><select id="t"><option value="">— নেই —</option><option>Title Sponsor</option><option>Gold Sponsor</option><option>Silver Sponsor</option><option>Supporter</option></select></div><div><label>লোগোর ছবির লিংক (https://…)</label><input id="l"></div><div><label>ওয়েবসাইট / Facebook লিংক</label><input id="u"></div></div>
<p><button id="add">➕ যোগ করুন</button> <button id="cancel" class="hide">✖️ বাতিল</button> <span id="msg" class="muted"></span></p>
<div id="hidBox" class="hide"><h3>🙈 লুকানো (ছাপানো তালিকার) Sponsor</h3><div id="hid"></div></div></section>
<section class="card" id="lg" style="margin-top:22px"><h2>🔐 Admin Login</h2><div class="g"><input id="em" type="email" placeholder="Admin email"><input id="pw" type="password" placeholder="Password"><button id="lb">Login</button></div></section>
</main>
<script type="module" src="sponsors.js"></script><script src="vcaj-enhance.js" defer></script></body></html>
